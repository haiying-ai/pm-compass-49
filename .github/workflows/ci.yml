name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: 过程定义与冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 冒烟测试
        run: python tests/run_smoke_tests.py

      - name: 49 个过程定义完整
        run: |
          python - <<'PY'
          import json, pathlib, sys
          roots = [p for p in pathlib.Path('.').rglob('*.json') if 'node_modules' not in str(p)]
          print(f'发现 {len(roots)} 个 JSON 文件')
          for p in roots:
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except json.JSONDecodeError as e:
                  print(f'  ✗ {p}: {e}')
                  sys.exit(1)
          print('全部合法')
          PY
